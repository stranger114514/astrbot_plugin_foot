<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>积分排行</title>
<style>
  :root {
    --bg:#0b0e13; --bg2:#0e1420; --panel:#141926; --panel2:#1a2130;
    --line:#2c3648; --line2:#3a465c;
    --text:#e6eaf2; --muted:#8d98ae; --faint:#5f6b82;
    --gold:#e8b45a; --gold2:#ffd98a;
    --cyan:#5b8def; --cyan2:#8fb4ff;
    --red:#e15656; --green:#4fc39a;
    --shadow:rgba(0,0,0,.55);
  }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; }
  body {
    font-family:"HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(1200px 600px at 50% -10%, #16202f 0%, transparent 60%),
      radial-gradient(900px 500px at 100% 100%, #101a2a 0%, transparent 55%),
      var(--bg);
    color:var(--text);
    overflow-y:auto; scroll-behavior:smooth;
  }
  /* 扫描线纹理 */
  body::before {
    content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
    background:repeating-linear-gradient(0deg, transparent 0 2px, rgba(255,255,255,.012) 2px 4px);
  }
  .app { position:relative; z-index:1; max-width:1460px; margin:0 auto; padding:28px 26px 100px; }

  /* ── 顶部档案头 ─────────────────────────── */
  header { margin-bottom:26px; border-bottom:1px solid var(--line); padding-bottom:20px; }
  .kicker {
    display:flex; align-items:center; gap:10px; margin-bottom:8px;
    color:var(--cyan2); font-size:12px; letter-spacing:3px; font-weight:600;
  }
  .kicker .bar { width:34px; height:1px; background:var(--cyan); }
  h1 {
    margin:0 0 6px; font-size:30px; font-weight:800; letter-spacing:1px;
    background:linear-gradient(180deg,#fff 0%,#c9d4e8 100%);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  }
  .sub { color:var(--muted); font-size:13px; letter-spacing:.5px; }
  .nav {
    margin-top:12px; background:var(--panel); color:var(--text);
    border:1px solid var(--line); border-radius:7px; padding:7px 14px;
    cursor:pointer; font-size:13px; transition:.2s;
  }
  .nav:hover { border-color:var(--gold); color:var(--gold); }

  /* ── 群档案卡片网格 ─────────────────────── */
  .grid { display:grid; gap:20px; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); }
  .dossier {
    position:relative; background:linear-gradient(180deg,var(--panel),var(--bg2));
    border:1px solid var(--line); border-radius:14px; overflow:hidden; cursor:pointer;
    box-shadow:0 10px 26px var(--shadow);
    transition:transform .25s ease, border-color .25s, box-shadow .25s;
    display:flex; flex-direction:column;
  }
  .dossier:hover { transform:translateY(-4px); border-color:var(--line2); box-shadow:0 18px 40px var(--shadow); }
  .dossier::before {
    content:""; position:absolute; left:0; top:0; bottom:0; width:3px;
    background:linear-gradient(180deg,var(--gold),transparent 70%);
  }
  .dossier-head {
    padding:16px 18px 12px; border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, rgba(232,180,90,.06), transparent);
  }
  .dossier-head .rh {
    font-size:10px; letter-spacing:2.5px; color:var(--faint); margin-bottom:6px;
    display:flex; align-items:center; gap:6px;
  }
  .dossier-head .rh::before { content:"◤"; color:var(--gold); font-size:12px; }
  .gname { font-size:20px; font-weight:800; letter-spacing:.5px; color:var(--text); }
  .gmeta { color:var(--muted); font-size:12px; margin-top:4px; }
  .gmeta b { color:var(--gold); font-weight:700; }

  .ranklist {
    flex:1; padding:10px 12px 12px; overflow-y:auto; max-height:320px;
    scrollbar-width:thin; scrollbar-color:var(--line) transparent;
  }
  .ranklist::-webkit-scrollbar { width:6px; }
  .ranklist::-webkit-scrollbar-thumb { background:var(--line); border-radius:3px; }
  .row {
    display:flex; align-items:center; gap:12px; padding:9px 10px;
    border-radius:9px; margin-bottom:3px; transition:background .2s;
  }
  .row:hover { background:var(--panel2); }
  /* 名次徽章：菱形，明日方舟风格 */
  .idx {
    width:34px; height:34px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:800; position:relative; color:var(--muted);
  }
  .idx::before {
    content:""; position:absolute; inset:3px; background:var(--panel2);
    border:1px solid var(--line2); transform:rotate(45deg); border-radius:4px;
  }
  .idx span { position:relative; z-index:1; }
  .row.top1 .idx::before { background:linear-gradient(135deg,#ffd98a,#c8892c); border-color:#ffd98a; }
  .row.top1 .idx span { color:#1a1206; }
  .row.top2 .idx::before { background:linear-gradient(135deg,#e8eef8,#9aa7bc); border-color:#c9d4e8; }
  .row.top2 .idx span { color:#141a24; }
  .row.top3 .idx::before { background:linear-gradient(135deg,#f0b98a,#b06a3a); border-color:#e0a878; }
  .row.top3 .idx span { color:#1d0f04; }
  .nm { flex:1; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text); }
  .sc {
    font-weight:800; font-size:16px; color:var(--gold);
    display:flex; align-items:center; gap:5px;
  }
  .sc::after { content:"分"; font-size:11px; color:var(--faint); font-weight:500; }
  .empty { color:var(--muted); font-size:13px; padding:16px; text-align:center; }

  /* ── 底部 ─────────────────────────────── */
  footer {
    position:fixed; left:0; right:0; bottom:0; z-index:20;
    background:rgba(11,14,19,.82); backdrop-filter:blur(10px);
    border-top:1px solid var(--line); padding:12px 26px;
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  }
  .pagesize { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:13px; }
  .pagesize select {
    background:var(--panel); color:var(--text); border:1px solid var(--line);
    border-radius:7px; padding:5px 8px; font-size:13px; cursor:pointer;
  }
  .pager { margin-left:auto; display:flex; align-items:center; gap:8px; }
  .pager button {
    background:var(--panel); color:var(--text); border:1px solid var(--line);
    border-radius:7px; padding:6px 14px; cursor:pointer; font-size:13px; transition:.2s;
  }
  .pager button:hover:not(:disabled) { border-color:var(--gold); color:var(--gold); }
  .pager button:disabled { opacity:.35; cursor:default; }
  .pager .pageinfo { color:var(--muted); font-size:13px; min-width:70px; text-align:center; }

  /* ── 放大档案 ─────────────────────────── */
  .modal {
    position:fixed; inset:0; z-index:100; background:rgba(5,7,11,.72);
    display:none; align-items:center; justify-content:center; padding:26px;
    backdrop-filter:blur(5px); opacity:0; transition:opacity .25s ease;
  }
  .modal.open { display:flex; opacity:1; }
  .modal-card {
    background:linear-gradient(180deg,var(--panel),var(--bg2));
    border:1px solid var(--line2); border-radius:16px; width:min(760px,100%);
    max-height:84vh; display:flex; flex-direction:column; padding:22px;
    transform:scale(.93); transition:transform .25s ease; box-shadow:0 24px 70px rgba(0,0,0,.7);
  }
  .modal.open .modal-card { transform:scale(1); }
  .modal-head { display:flex; align-items:baseline; gap:12px; margin-bottom:14px; padding-bottom:12px; border-bottom:1px solid var(--line); }
  .modal-head .gname { font-size:26px; font-weight:800; }
  .modal-head .gmeta { color:var(--muted); font-size:13px; }
  .modal-close { margin-left:auto; background:transparent; border:none; color:var(--muted); font-size:26px; cursor:pointer; line-height:1; }
  .modal-close:hover { color:var(--text); }
  .modal .ranklist { max-height:60vh; }

  .loading { text-align:center; color:var(--muted); padding:48px; font-size:14px; letter-spacing:1px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="kicker"><span class="bar"></span>RHODES ISLAND // RANKING ARCHIVE</div>
    <h1>干员积分排行</h1>
    <div class="sub">各群历史最高分档案 · 滚轮浏览 · 点击档案卡放大</div>
    <button class="nav" onclick="goGallery()">← 图库与文案</button>
  </header>
  <div class="grid" id="grid"><div class="loading">正在调取档案…</div></div>
</div>

<footer>
  <div class="pagesize">
    每页档案
    <select id="pageSize">
      <option value="10" selected>10</option>
      <option value="20">20</option>
      <option value="100">100</option>
    </select>
    份
  </div>
  <div class="pager">
    <button id="prevBtn">‹ 上一页</button>
    <span class="pageinfo" id="pageInfo">1 / 1</span>
    <button id="nextBtn">下一页 ›</button>
  </div>
</footer>

<div class="modal" id="modal">
  <div class="modal-card">
    <div class="modal-head">
      <span class="gname" id="mName"></span>
      <span class="gmeta" id="mMeta"></span>
      <button class="modal-close" id="mClose">×</button>
    </div>
    <div class="ranklist" id="mList"></div>
  </div>
</div>

<script>
(function(){
  const bridge = () => window.AstrBotPluginPage;
  let groups = [];
  let page = 0;
  let pageSize = 10;

  const $grid = document.getElementById('grid');
  const $pageInfo = document.getElementById('pageInfo');
  const $prevBtn = document.getElementById('prevBtn');
  const $nextBtn = document.getElementById('nextBtn');
  const $pageSize = document.getElementById('pageSize');
  const $modal = document.getElementById('modal');
  const $mName = document.getElementById('mName');
  const $mMeta = document.getElementById('mMeta');
  const $mList = document.getElementById('mList');
  const $mClose = document.getElementById('mClose');

  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

  function badge(i){
    if(i===0) return '◆';
    if(i===1) return '◆';
    if(i===2) return '◆';
    return i+1;
  }

  function rankListHTML(ranking){
    if(!ranking || !ranking.length) return '<div class="empty">暂无有效积分</div>';
    return ranking.map((r,i)=>{
      const nm = r[0] || '未知';
      const sc = r[1];
      const cls = i<3 ? ' top'+(i+1) : '';
      return `<div class="row${cls}"><div class="idx"><span>${badge(i)}</span></div><div class="nm">${esc(nm)}</div><div class="sc">${sc}</div></div>`;
    }).join('');
  }

  function totalPages(){ return Math.max(1, Math.ceil(groups.length / pageSize)); }

  function render(){
    const total = totalPages();
    if(page >= total) page = total - 1;
    if(page < 0) page = 0;
    const start = page * pageSize;
    const slice = groups.slice(start, start + pageSize);
    if(!slice.length){
      $grid.innerHTML = '<div class="empty" style="grid-column:1/-1">暂无群聊积分档案，去群里发 /猜角色 玩一局吧</div>';
    } else {
      $grid.innerHTML = slice.map(g=>{
        const best = g.ranking && g.ranking.length ? g.ranking[0][1] : 0;
        const idx = groups.indexOf(g);
        return `<div class="dossier" data-i="${idx}">
          <div class="dossier-head">
            <div class="rh">PROFILE · ${esc(g.group_id)}</div>
            <div class="gname">${esc(g.group_name)}</div>
            <div class="gmeta"><b>${g.ranking.length}</b> 人上榜${best? ' · 榜首 <b>'+best+'</b> 分':''}</div>
          </div>
          <div class="ranklist">${rankListHTML(g.ranking)}</div>
        </div>`;
      }).join('');
    }
    $pageInfo.textContent = (total? page+1:0) + ' / ' + total;
    $prevBtn.disabled = page <= 0;
    $nextBtn.disabled = page >= total - 1;
  }

  function openModal(i){
    const g = groups[i]; if(!g) return;
    $mName.textContent = g.group_name;
    $mMeta.textContent = g.ranking.length + ' 人上榜 · 群号 ' + g.group_id;
    $mList.innerHTML = rankListHTML(g.ranking);
    $modal.classList.add('open');
  }
  function closeModal(){ $modal.classList.remove('open'); }

  async function load(){
    try{
      const d = await bridge().apiGet('ranking');
      groups = (d && d.groups) || [];
      render();
    }catch(e){
      $grid.innerHTML = '<div class="empty">档案调取失败：'+esc(e&&e.message)+'</div>';
    }
  }

  $pageSize.addEventListener('change', e => { pageSize = parseInt(e.target.value,10); page = 0; render(); });
  $prevBtn.addEventListener('click', () => { if(page>0){page--;render();} });
  $nextBtn.addEventListener('click', () => { if(page<totalPages()-1){page++;render();} });
  $grid.addEventListener('click', e => {
    const b = e.target.closest('.dossier');
    if(b) openModal(parseInt(b.dataset.i,10));
  });
  $mClose.addEventListener('click', closeModal);
  $modal.addEventListener('click', e => { if(e.target === $modal) closeModal(); });
  document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });

  // 档案内滚轮只滚档案内列表
  $grid.addEventListener('wheel', e => {
    const rl = e.target.closest('.ranklist');
    if(rl && rl.scrollHeight > rl.clientHeight){
      const atTop = rl.scrollTop <= 0 && e.deltaY < 0;
      const atBottom = rl.scrollTop + rl.clientHeight >= rl.scrollHeight - 1 && e.deltaY > 0;
      if(!(atTop || atBottom)){ e.stopPropagation(); }
    }
  }, { passive:false });

  function goGallery() {
    window.parent.location.hash = '#/plugin-page/astrbot_plugin_foot/dashboard';
  }

  (function init(){
    const b = bridge();
    if(!b){ setTimeout(init, 100); return; }
    Promise.resolve(b.ready ? b.ready() : null).then(load).catch(load);
  })();
})();
</script>
</body>
</html>
